services:
  # ── PostgreSQL Database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gotzh1234
      POSTGRES_DB: UserDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend (YOLO + EasyOCR) ─────────────────────────────
  backend:
    build: ./Web/BackEnd
    container_name: cv_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Points to the 'db' service via Docker's internal DNS
      DATABASE_URL: postgresql://postgres:gotzh1234@db:5432/UserDB
    volumes:
      # Persist uploaded videos and captured violation screenshots
      - backend_uploads:/app/uploads
      - backend_captures:/app/captures
      - ml_captures:/app/ML/captures
    depends_on:
      db:
        condition: service_healthy

  # ── Next.js Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./Web/frontend
      args:
        # The browser calls the backend at this URL
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: cv_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_captures:
  ml_captures: